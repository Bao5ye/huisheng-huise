<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="thf-token" content="__THF_TOKEN__">
<script src="config.js"></script>
<title>绘声绘色 AI绘本工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  /* 布局：单栏工作台。顶部品牌条 + 步骤条 + 智能体状态条 + 当前步骤内容。身份决定主色与字号。 */
  --paper:#F1F5EE; --card:#FFFFFF; --ink:#15232A; --muted:#51636B; --line:#D2DCD4;
  --accent:#0E7C6B; --accent-soft:#DCEFEA; --sun:#F2B01E;
  --ok:#1B7F4B; --warn:#8A5200; --bad:#B3261E;
  --display:"ZCOOL KuaiLe","Microsoft YaHei UI","PingFang SC",sans-serif;
  --body:"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --r:14px; color-scheme:light;
}
html{font-size:16px}
html[data-role="elder"]{font-size:20px;--accent:#A44D08;--accent-soft:#FBE8D5}
html[data-role="child"]{font-size:18px;--accent:#C02459;--accent-soft:#FDE2EB}
html[data-role="parent"]{--accent:#3B53C9;--accent-soft:#E2E7FB}
html[data-hc="1"]{--paper:#FFFFFF;--ink:#000;--muted:#1d1d1d;--line:#000}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 0 4px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:1.75rem;color:var(--accent);line-height:1}
.sub{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--ok)} .pill.bad i{background:var(--bad)} .pill.wait i{background:var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.85rem;border-width:1px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
html[data-role="elder"] .btn,html[data-role="child"] .btn{min-height:56px;font-size:1.05rem}
html[data-role="elder"] .btn.sm,html[data-role="child"] .btn.sm{min-height:44px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.step{flex:1 0 auto;min-width:84px;border:0;background:transparent;padding:6px 4px 8px;border-bottom:4px solid var(--line);color:var(--muted);font-size:.85rem;cursor:pointer;text-align:left}
.step b{display:block;font-size:.7rem;font-weight:600;opacity:.8}
.step.on{border-color:var(--accent);color:var(--ink);font-weight:700}
.step.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.step[disabled]{cursor:default;opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{margin:0 0 4px;font-size:1.2rem}
.card h3{margin:14px 0 6px;font-size:1rem}
.hint{color:var(--muted);font-size:.88rem;margin:2px 0 0}
h1.hero{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.5rem);margin:8px 0 0;text-wrap:balance;line-height:1.2}
.lead{color:var(--muted);max-width:40em;margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.role{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;border-left:10px solid var(--accent)}
.role:hover{border-color:var(--accent);background:var(--accent-soft)}
.ric{grid-row:span 2;font-size:2.4rem;line-height:1}
.rn{font-family:var(--display);font-size:1.35rem;color:var(--accent)}
.rt{font-size:.78rem;font-weight:700;color:var(--muted)}
.rd{grid-column:1/-1;color:var(--muted);font-size:.9rem;margin-top:6px}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pipe .n{flex:1 1 118px;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;background:var(--card);font-size:.82rem;color:var(--muted)}
.pipe .n b{display:block;color:var(--ink);font-size:.92rem}
.pipe .n em{font-style:normal;font-size:.7rem;font-weight:700;color:var(--accent)}
.dock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.dock-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.85rem}
.ags{display:flex;gap:6px;overflow-x:auto}
.ag{flex:0 0 auto;display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:center;padding:4px 10px;border-radius:10px;border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.ag i{width:9px;height:9px;border-radius:50%;background:var(--line);grid-row:span 2}
.ag b{color:var(--ink);font-size:.82rem}
.ag span{grid-column:2}
.ag.run{border-color:var(--sun);background:#FFF7DF}.ag.run i{background:var(--sun);animation:pulse 1s infinite}
.ag.done i{background:var(--ok)} .ag.err i{background:var(--bad)} .ag.err{border-color:var(--bad)}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.working{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#FFF7DF;border:2px solid var(--sun);border-radius:var(--r);padding:12px 16px;font-weight:700}
.dots{width:14px;height:14px;border-radius:50%;background:var(--sun);animation:pulse 1s infinite}
.err{background:#FCEBE9;border:2px solid var(--bad);color:#6d1410;border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.stale{background:#FFF3D6;border:2px solid var(--sun);border-radius:var(--r);padding:12px 16px;color:#5a3b00;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sec{display:flex;flex-direction:column;gap:14px}
.q{display:flex;flex-direction:column;gap:8px}
.q>label,.q>.ql{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip .ci{font-size:1.25em;line-height:1}
html[data-role="elder"] .chip,html[data-role="child"] .chip{min-height:60px;padding:8px 20px;border-radius:18px;font-size:1.05rem}
html[data-role="child"] .chip .ci,html[data-role="elder"] .chip .ci{font-size:1.7em}
.subs{margin:2px 0 6px;padding:10px;border-radius:12px;background:var(--accent-soft)}
.subs .chip{min-height:34px;padding:2px 12px;font-size:.9rem;border-width:1px}
.tf{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.tf input,.tf textarea,.in{flex:1 1 220px;min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);width:100%}
.tf textarea{resize:vertical;line-height:1.6}
.mic{min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-weight:700;cursor:pointer}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.wiz{display:flex;flex-direction:column;gap:18px;min-height:320px}
.wiz .wt{font-family:var(--display);font-size:1.7rem;line-height:1.3;margin:0;text-wrap:balance}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;font-size:.85rem}
.grade div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.grade b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0}
.kv dt{color:var(--muted);font-size:.85rem;white-space:nowrap}
.kv dd{margin:0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.tag.w{background:#FFF3D6;color:var(--warn)} .tag.b{background:#FCEBE9;color:var(--bad)} .tag.g{background:#E1F3E8;color:var(--ok)}
ol.beats{margin:6px 0;padding-left:1.4em} ol.beats li{margin:2px 0}
.stars button{font-size:1.7rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px;line-height:1}
.stars button.on{color:var(--sun)}
.pg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.pg-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.pg-h b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--accent)}
.pg textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1.05rem;line-height:1.7;resize:vertical;background:var(--card)}
.pg .bigtxt{font-size:1.2rem;line-height:1.9;margin:0}
.pg small{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.th{border:3px solid var(--line);border-radius:14px;padding:0;background:var(--card);cursor:pointer;overflow:hidden;text-align:left}
.th img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.th span{display:block;padding:6px 10px 0;font-weight:700}
.th small{display:block;padding:0 10px 8px;color:var(--muted);font-size:.78rem}
.th.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.2)}
.sw i{width:14px;height:20px;display:block}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.shot{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:.82rem;background:var(--card)}
.shot svg{width:80px;height:56px;border-radius:6px;display:block}
.shot select{width:100%;min-height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.cell .ph{aspect-ratio:4/3;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#fff,#fff 10px,var(--paper) 10px,var(--paper) 20px);color:var(--muted);font-size:.9rem;text-align:center;padding:10px}
.cell img{display:block;width:100%}
.cell .cm{padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.sheet{max-width:520px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet img{display:block;width:100%}
.book{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(21,35,42,.12);overflow:hidden}
.book .pic{position:relative;background:var(--paper)}
.book .pic img{display:block;width:100%}
.book .noimg{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted)}
.book .ttl{position:absolute;left:0;right:0;top:0;padding:14px 16px 18px;text-align:center;font-family:var(--display);font-size:clamp(1.6rem,6vw,2.8rem);line-height:1.2;color:var(--ink);background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.72) 70%,rgba(255,255,255,0));text-wrap:balance}
.book .ai{position:absolute;right:8px;bottom:8px;font-size:.7rem;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px;color:var(--muted)}
.book .txt{padding:18px 22px;font-size:1.3rem;line-height:1.95;letter-spacing:.02em;margin:0}
.book .tip{margin:0 22px 16px;padding:8px 12px;border-left:4px solid var(--sun);background:#FFF7DF;font-size:.92rem;border-radius:0 8px 8px 0}
.book .nav{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.pn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.msg{padding:8px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.ovl{position:fixed;inset:0;background:rgba(21,35,42,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{width:min(560px,100%);height:100%;background:var(--paper);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fld label{font-size:.85rem;font-weight:700}
.fld textarea{min-height:92px;font-size:.88rem}
.fld>.in{flex:none}
.guide3{display:flex;flex-direction:column;gap:10px}
.guide3 .g{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.guide3 .num{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem}
details{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
pre.pp{white-space:pre-wrap;word-break:break-word;font-size:.78rem;background:var(--paper);padding:10px;border-radius:8px;max-height:260px;overflow:auto;margin:6px 0}
a{color:var(--accent)}
ul.plain{margin:6px 0;padding-left:1.2em}
@media (max-width:520px){.card{padding:14px}.book .txt{font-size:1.15rem;padding:14px 16px}.roles{grid-template-columns:1fr 1fr}.role{grid-template-columns:1fr;padding:12px}.ric{grid-row:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ========== 基础数据 ========== */
const ROLES={
  librarian:{name:'图书馆员',tag:'专业模式',icon:'📚',desc:'为故事会、主题活动、分级阅读指导定制绘本，可调智能体约束，附活动方案',c:'#0E7C6B',s:'#DCEFEA'},
  parent:{name:'爸爸妈妈',tag:'简洁模式',icon:'👨‍👩‍👧',desc:'一页填完孩子的情况，直接看故事、选画风',c:'#3B53C9',s:'#E2E7FB'},
  elder:{name:'爷爷奶奶',tag:'大字语音模式',icon:'👵',desc:'字大、一步一问，每一步都能点喇叭听讲解',c:'#A44D08',s:'#FBE8D5'},
  child:{name:'小朋友自己',tag:'图画语音模式',icon:'🧒',desc:'点图画、说句话，做一本自己的书',c:'#C02459',s:'#FDE2EB'}
};
const BANDS=[
  {id:'0-3',label:'0—3岁',pages:6,chars:[8,20],lang:'极短句、拟声词和叠词，同一句式反复出现；一页只认识一样东西'},
  {id:'3-4',label:'3—4岁',pages:6,chars:[15,35],lang:'短句，重复句式，贴近日常生活，情节是简单的先后顺序'},
  {id:'4-5',label:'4—5岁',pages:8,chars:[25,50],lang:'短句为主，可有简单对话，情节有一个小波折'},
  {id:'5-6',label:'5—6岁',pages:8,chars:[35,70],lang:'句子完整，有对话和简单因果，可以出现 1—2 个新词并在上下文里解释'},
  {id:'6-7',label:'6—7岁',pages:8,chars:[50,90],lang:'适合开始自主阅读：常用字为主，句子不过长，有起因—经过—结果'},
  {id:'7-8',label:'7—8岁',pages:10,chars:[60,110],lang:'可有多个角色和转折，适量形容词和心理描写，知识点可稍具体'},
  {id:'8-12',label:'8—12岁',pages:10,chars:[90,160],lang:'情节更完整，可以有悬念和幽默，知识内容要有依据、讲清原理'}
];
const INTS=[
  {id:'animal',label:'动物',icon:'🦊',subs:['小狐狸','兔子','小猫','小狗','大象','熊猫','小鸟','昆虫','海洋动物']},
  {id:'dino',label:'恐龙',icon:'🦕',subs:['霸王龙','三角龙','腕龙','翼龙','剑龙','恐龙蛋与化石']},
  {id:'vehicle',label:'交通工具',icon:'🚒',subs:['消防车','火车','挖掘机','飞机','轮船','公交车','火箭']},
  {id:'plant',label:'植物',icon:'🌻',subs:['花朵','大树','种子发芽','蔬菜水果','蘑菇','四季变化']},
  {id:'space',label:'太空',icon:'🚀',subs:['月亮','星星','行星','宇航员']},
  {id:'ocean',label:'海洋',icon:'🐳',subs:['鲸鱼','海龟','珊瑚礁','潜水艇']},
  {id:'food',label:'美食',icon:'🍜',subs:['包饺子','面条','水果','做蛋糕']},
  {id:'festival',label:'节日与传统',icon:'🏮',subs:['春节','中秋','端午','二十四节气','民间故事']},
  {id:'robot',label:'机器人与科技',icon:'🤖',subs:['机器人朋友','发明创造','人工智能']},
  {id:'library',label:'图书馆与书',icon:'📖',subs:['去图书馆','借书还书','书里的世界']},
  {id:'daily',label:'日常生活',icon:'🏡',subs:['幼儿园','交朋友','家人','睡觉','刷牙洗手']},
  {id:'other',label:'其他',icon:'✏️',subs:[]}
];
const INT=Object.fromEntries(INTS.map(x=>[x.id,x]));
const ALLR=['librarian','parent','elder','child'];
const o=(v,i,l,lc)=>({v,l:l||v,i,lc});
const Q=[
  {id:'nick',sec:'小读者',type:'text',t:'孩子的小名（可不填）',te:'孩子的小名叫什么？',tc:'你叫什么名字呀？',ph:'用小名就好，不用填真实全名',opt:1},
  {id:'band',sec:'小读者',type:'one',t:'孩子的年龄',te:'孩子今年几岁？',tc:'你几岁啦？',opts:BANDS.map(b=>o(b.id,null,b.label)),req:1},
  {id:'gender',sec:'小读者',type:'one',t:'孩子的性别',te:'是孙女还是孙子？',tc:'你是女孩还是男孩？',opts:[o('女孩','👧'),o('男孩','👦'),o('不指定','🌈')]},

async function httpErr(r){let j={};try{j=await r.clone().json();}catch(e){}
  const e=typeof j.error==='string'?j.error:'';
  if(['no_key','bad_code','network'].includes(e))return{code:e};

  if(r.status===401)return{code:'bad_key'};
  if(r.status===402)return{code:'no_balance'};
  const m=(j.error&&j.error.message)||(j.base_resp&&j.base_resp.status_msg)||'';
  return{code:'http',message:'HTTP '+r.status+(m?'，'+m:'')};}

function h(tag,a,...kids){const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false||c==='')continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;}

/* 腾讯云语音：每次最多 150 字，按句切成 140 字以内的段，边播边取下一段，听过的缓存起来不重复计费 */
const ttsCloud=()=>!!(BK&&BK.tts&&S.cfg.tts.engine==='tencent');
const voiceOK=()=>ttsCloud()||!!CAP.tts||('speechSynthesis' in window);
const TTS_CACHE=new Map();let ttsGen=0,curAudio=null;
function ttsChunks(t){t=String(t||'').replace(/\s+/g,' ').trim();const out=[];let cur='';
  for(const s of t.split(/(?<=[。！？；!?…])/)){if((cur+s).length<=140)cur+=s;else{if(cur.trim())out.push(cur);let x=s;while(x.length>140){out.push(x.slice(0,140));x=x.slice(140);}cur=x;}}
  if(cur.trim())out.push(cur);return out;}
function ttsSpeed(){const v=+S.cfg.tts.speed||0;return S.role==='elder'?Math.min(v,-1):v;}
function ttsFetch(text){const k=S.cfg.tts.voice+'|'+ttsSpeed()+'|'+text;if(TTS_CACHE.has(k))return TTS_CACHE.get(k);
  const p=(async()=>{let r;try{r=await fetch(API+'/api/tts',{method:'POST',headers:hdr(),body:JSON.stringify({text,voice:+S.cfg.tts.voice||403011,speed:ttsSpeed()})});}catch(e){throw{code:'network'};}
    if(!r.ok)throw await httpErr(r);const j=await r.json(),R=j.Response||j;
    if(R.Error)throw{code:'tts',message:(R.Error.Code||'')+' '+(R.Error.Message||'')};if(!R.Audio)throw{code:'tts',message:'没有返回音频'};
    return 'data:audio/mpeg;base64,'+R.Audio;})();
  p.catch(()=>TTS_CACHE.delete(k));TTS_CACHE.set(k,p);if(TTS_CACHE.size>120)TTS_CACHE.delete(TTS_CACHE.keys().next().value);return p;}
async function cloudSay(t,done){const g=++ttsGen,parts=ttsChunks(t);if(!parts.length){done&&done(false);return;}
  try{let next=ttsFetch(parts[0]);
    for(let i=0;i<parts.length;i++){const url=await next;if(g!==ttsGen)return;if(i+1<parts.length)next=ttsFetch(parts[i+1]);
      await new Promise((res,rej)=>{const a=new Audio(url);curAudio=a;a.onended=res;a._stop=res;a.onerror=()=>rej({code:'tts',message:'播放失败'});const pr=a.play();if(pr&&pr.catch)pr.catch(rej);});
      if(g!==ttsGen)return;}
    S.ui.ttsErr='';done&&done(true);}
  catch(e){if(g!==ttsGen)return;S.ui.ttsErr=e&&e.code==='tts'?'腾讯云语音：'+e.message:emsg(e);render();done&&done(false);}}
function stopSay(){ttsGen++;if(curAudio){try{curAudio.pause();curAudio._stop&&curAudio._stop();}catch(e){}curAudio=null;}
  try{if(CAP.tts)CAP.tts.stop();else if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function say(t,done){if(!t||!voiceOK()){done&&done(false);return;}
  if(ttsCloud()){stopSay();cloudSay(String(t),done);return;}
  const rate=S.role==='elder'?0.85:1;
  if(CAP.tts){CAP.tts.speak(String(t).slice(0,1900),{language:'zh-CN',rate}).then(()=>done&&done(true)).catch(()=>done&&done(false));}
  else{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=rate;u.onend=()=>done&&done(true);u.onerror=()=>done&&done(false);speechSynthesis.speak(u);}catch(e){done&&done(false);}}}

async function llm(agent,input,o={}){
  const cfg=S.cfg.text,ctl=new AbortController();CTLS.add(ctl);
  try{
    const E=eff('text');
    if(E==='deepseek'||E==='proxy'){
      if(E==='deepseek'&&!cfg.key)throw{code:'no_key'};
      const messages=typeof input==='string'?[{role:'user',content:input}]:input;let r;
      try{r=await fetch(E==='proxy'?API+'/api/deepseek/chat/completions':cfg.endpoint.replace(/\/$/,'')+'/chat/completions',{method:'POST',signal:ctl.signal,headers:E==='proxy'?hdr():{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(Object.assign({model:o.model||cfg.model,messages,stream:false},o.json?{response_format:{type:'json_object'}}:{},o.temp?{temperature:o.temp}:{}))});}
      catch(e){throw{code:ctl.signal.aborted?'cancelled':'network'};}
      if(!r.ok)throw await httpErr(r);
      const j=await r.json();return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    }
    if(!CAP.sample)throw{code:'no_engine'};
    const opts={signal:ctl.signal,modelTier:o.tier||'default',onText:({text})=>agProg(agent,text.length)};
    if(o.fresh)opts.cache=false;
    const res=await CAP.sample(input,opts);return res.text;
  }finally{CTLS.delete(ctl);}
}
function parseJSON(t){t=String(t).trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1].trim();
  try{return JSON.parse(t);}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw{code:'invalid_json'};}
async function agent(id,prompt,o={}){
  const cur=S.ag[id]||{run:0};agSet(id,{run:cur.run+1,st:'run',chars:0,prompt:typeof prompt==='string'?prompt:prompt.map(m=>m.role+'：'+m.content).join('\n\n'),note:''});render();
  try{const t=await llm(id,prompt,o);const out=o.json?parseJSON(t):t;agSet(id,{run:S.ag[id].run-1,st:'done'});return out;}
  catch(e){agSet(id,{run:S.ag[id].run-1,st:e&&e.code==='cancelled'?'idle':'err',note:emsg(e)});throw e;}
}

function conflicts(){const n=S.needs,c=[],subs=[].concat(...Object.values(n.interests)),inI=k=>k in n.interests;
  if(n.band==='0-3'&&/认字|独立/.test(n.how))c.push({m:'年龄是 0—3 岁，阅读方式却选了“'+n.how+'”，两者对不上。',r:'按 0—3 岁、大人读给孩子听来写',fix:['改为“大人读给孩子听”',()=>setNeed('how','大人读给孩子听')]});
  if(S.role==='librarian'&&/小组|集体/.test(n.group)&&/^孩子/.test(n.hero))c.push({m:'活动是多人参加，主角却设成某一个孩子本人，其他孩子不好代入。',r:'主角改为所有孩子都能代入的原创角色',fix:['主角改为原创新角色',()=>setNeed('hero','一个原创的新角色')]});
  if(/^孩子/.test(n.hero)&&!n.nick&&!n.heroName)c.push({m:'主角是孩子本人，但没有填小名，故事里会叫“宝宝”。',fix:null});
  if(n.hero==='孩子本人'&&n.nick&&n.heroName&&n.heroName!==n.nick)c.push({m:'主角是孩子本人，小名是“'+n.nick+'”，主角名却填了“'+n.heroName+'”。',r:'主角名以“'+n.heroName+'”为准',fix:['主角名改用小名',()=>setNeed('heroName',n.nick)]});
  if(/动物/.test(n.hero)&&!(inI('animal')||inI('dino')||inI('ocean')))c.push({m:'主角里有动物，但兴趣没有选动物、恐龙或海洋，故事策划会自己挑一种。',fix:null});
  if(n.when==='睡前'&&n.tone==='冒险的')c.push({m:'睡前读冒险故事容易兴奋。',r:'保留冒险，但最后两页节奏放缓，落在安静入睡',fix:['基调改为“温暖的”',()=>setNeed('tone','温暖的')]});
  if(n.when==='睡前'&&n.ending==='留一个小悬念')c.push({m:'睡前留悬念，孩子可能惦记着不肯睡。',r:'悬念要轻，最后一句落在安心',fix:['结尾改为“回到睡觉或回家”',()=>setNeed('ending','回到睡觉或回家')]});
  if(n.langStyle==='儿歌一样押韵'&&n.density==='more')c.push({m:'押韵的儿歌体适合短句，和“文字多一些”冲突。',r:'以押韵短句为准',fix:['文字量改回按年龄推荐',()=>setNeed('density','')]});
  if(n.band==='0-3'&&pagesN()>=10)c.push({m:'0—3 岁孩子专注时间短，'+pagesN()+' 页偏长。',fix:['改为 6 页',()=>setNeed('pages','6')]});
  if(pagesN()>=10&&n.minutes==='5 分钟')c.push({m:'选了 '+pagesN()+' 页，但一次只读 5 分钟，可能读不完。',fix:['改为 6 页',()=>setNeed('pages','6')]});
  const hit=(a,ok,what)=>{if(n.avoid.includes(a)&&ok)c.push({m:'要避开“'+a+'”，但又选了'+what+'。',r:'可以出现'+what+'，但写得可爱、明亮，不制造害怕',fix:['取消避开“'+a+'”',()=>setNeed('avoid',n.avoid.filter(x=>x!==a))]});};
  hit('虫子',subs.includes('昆虫'),'昆虫');hit('怪物',subs.includes('霸王龙'),'霸王龙');hit('黑暗',inI('space')||n.place==='太空','太空题材');hit('高处',subs.includes('飞机')||subs.includes('火箭'),'飞机或火箭');hit('打针看病',/看病|医院|打针/.test(n.concern+n.crush+n.custom),'看病的情节');
  if(n.avoid.includes('和家人分开')&&/^(喜欢的|一个原创)/.test(n.hero)===false&&n.family.length===0&&/幼儿园/.test(n.concern))c.push({m:'想缓解上幼儿园的分离，却又要避开“和家人分开”。',r:'写短暂分开后重聚，重点放在重聚',fix:null});
  if(/机器朗读/.test(n.elderMode)&&!voiceOK())c.push({m:'选了机器朗读，但这台设备不支持朗读，换电脑浏览器打开才能听。',fix:null});
  return c;}
function brief(){const n=S.needs,b=band(),L=[];
  L.push('【制作者】'+ROLES[S.role].name+'。'+ROLE_BRIEF[S.role](n));
  L.push('【小读者】'+(n.nick?'小名：'+n.nick+'；':'')+'年龄段：'+b.label+'；性别：'+n.gender);
  if(n.how)L.push('【孩子现在怎么读】'+n.how);
  if(n.when)L.push('【通常什么时候读】'+n.when);
  L.push('【兴趣】'+Object.entries(n.interests).map(([k,v])=>INT[k].label+(v.length?'（具体喜欢：'+v.join('、')+'）':'')).join('；'));
  if(n.crush)L.push('【最近着迷】'+n.crush);
  L.push('【主角设定】'+heroLine());
  if(n.tone)L.push('【故事基调】'+n.tone);
  if(n.place)L.push('【故事发生地】'+n.place);
  if(n.family.length)L.push('【一起出场的人】'+n.family.join('、')+'（配角，不抢主角的戏）');
  if(n.goals.length)L.push('【希望这本书带来】'+n.goals.join('、'));
  if(n.engage.length)L.push('【互动方式】'+n.engage.join('；'));
  if(n.avoid.length)L.push('【必须避开】'+n.avoid.join('、'));
  if(n.langStyle)L.push('【语言风格】'+n.langStyle);
  if(n.ending)L.push('【结尾方式】'+n.ending);
  if(n.custom)L.push('【其他要求】'+n.custom);
  const c=cr();L.push('【分级框定】正文 '+pagesN()+' 页（不含封面）；每页 '+c[0]+'—'+c[1]+' 个汉字；语言：'+b.lang);
  const rules=conflicts().filter(x=>x.r).map(x=>x.r);if(rules.length)L.push('【选项有冲突时的处理】'+rules.join('；'));
  return L.join('\n');}
function pOutline(prev,fb){return '【任务:outline】你是公共图书馆儿童绘本项目的「故事策划」智能体。请根据下面采集到的需求，归纳出一本原创绘本的梗概。\n\n'+brief()+'\n\n【创作约束】\n'+S.cons.planner+'\n'+SAFETY+
  (prev?'\n\n【上一版梗概】'+JSON.stringify(prev.d)+'\n【用户评价】'+(prev.rating?prev.rating+' 星（满分 5）':'未打分')+'。意见：'+(fb||'想换一个新的故事')+'\n请根据意见改写；没有被批评的优点可以保留。':'')+
  '\n\n'+CRAFT+'\n\n只输出一个 JSON 对象，不要任何其他文字。格式：\n{"title":"书名，不超过12个字，有画面感","logline":"一句话主线","heart":"故事核：主角真正想要的一件具体的小事，或遇到的一个具体的小麻烦","arc":"情感弧线：用→连接 4—5 个情绪点","refrain":"一句不超过12个字、孩子能跟着念的反复句","motif":"贯穿全书、首尾呼应的一个具体意象（一样东西、一种声音或一种颜色）","synopsis":"梗概，120字以内","theme":"想传递的东西（不写进正文）","knowledge":["知识点"],"characters":[{"name":"名字","kind":"是什么","look":"外形：体型、各部位的颜色、服饰、一眼能认出的标志物，写具体","trait":"性格"}],"beats":["第1页：发生什么（翻页钩子：……）","第2页：……"],"why":"这本书为什么适合这位小读者，对照需求说"}\n要求：characters 最多 3 个；beats 的条数必须正好是 '+pagesN()+' 条。';}
const CRAFT='【大师级儿童绘本写作守则】\n'+
'1. 图文分工：文字只写画面画不出来的东西——声音、心里话、时间的流逝、对话、气味和温度；画面里一眼能看到的颜色、样子、动作，不要再用文字描述一遍。\n'+
'2. 一页一个节拍：每页只推进一小步。每页最后一句给读者一个“翻页的理由”：一个问题、一个停顿、半句话或一点悬念。\n'+
'3. 好听、好读：写给耳朵听，大声读出来要顺口。长短句交替，短句为主，节奏像呼吸一样有起伏。叠词和拟声词点到为止；押韵可以有，绝不为押韵硬凑。\n'+
'4. 重复与变奏：用一句简短好记的反复句贯穿全书，出现三次左右，最后一次要有变化或反转；情节可用“三次尝试”结构，每次比上次多走一步。\n'+
'5. 具体胜过抽象：用孩子摸得着、听得见的具体名词和有力的动词。少用形容词，不堆成语，不用“非常”“十分”“美丽的”“开心极了”这类空泛的词，不用书面腔和网络语。\n'+
'6. 写动作，不贴标签：不说“他很害怕”，写他做了什么（把耳朵压低，往妈妈身后躲）。情感克制，留给孩子自己体会。\n'+
'7. 孩子的眼睛：用孩子的逻辑看世界，允许天真的误会和小小的幽默；不让大人出面解决问题，让主角自己想办法。\n'+
'8. 不说教：不许出现“我们要……”“这告诉我们……”“从此以后再也不……了”“明白了一个道理”之类的总结句；道理藏在情节和画面里。\n'+
'9. 知识长在故事里：知识点由角色亲眼发现、亲手试出来，用一句话自然带出，不讲课。\n'+
'10. 结尾有余味：安静落地，或回到开头的意象，与第一页遥相呼应；最后一句要短，留一点空白。\n'+
'按年龄取用：0—4 岁以节奏、重复、拟声为主，几乎不用对话；6 岁以上可以有更多对话、心理活动和小幽默。';
const CRAFT_EX='【示范（只学方法，不要照抄句子）】\n'+
'平庸：小兔子很害怕，它不敢一个人走进黑黑的森林。妈妈告诉它要勇敢。\n'+
'更好：森林黑乎乎的。小兔子把耳朵竖起来，又放下去。“咚、咚、咚。”是谁在敲门？哦，是它自己的心。\n'+
'平庸：小狐狸种下了种子，每天浇水，种子终于发芽了，它非常开心。\n'+
'更好：第一天，土是平的。第二天，土还是平的。第三天——土里悄悄顶出一点绿。';
const INTERACT={librarian:'面向一群孩子的提问或带动作的口令',parent:'亲子之间的一句提问',elder:'祖辈能随口说出的家常话',child:'直接对孩子说的小任务（找一找、学一学）'};
function pStory(fb){const b={chars:cr()},d=S.outline.d;return '【任务:story】你是「故事作家」智能体，一位写过许多经典图画书的儿童文学作家。请把下面已经由用户确认的梗概，写成逐页的绘本文字。动笔前先在心里把全书大声读一遍，想好节奏的起伏，再一页一页写。\n\n'+brief()+'\n\n【已确认的梗概】\n'+JSON.stringify(d)+
  (d.refrain?'\n【反复句】“'+d.refrain+'”——在关键页出现三次左右，最后一次要有变化。':'')+(d.motif?'\n【核心意象】'+d.motif+'——第一页出现，最后一页呼应。':'')+
  '\n\n'+CRAFT+'\n\n'+CRAFT_EX+'\n\n【创作约束】\n'+S.cons.writer+'\n'+SAFETY+(fb?'\n\n【用户对上一稿的意见】'+fb:'')+
  '\n\n只输出一个 JSON 对象，不要任何其他文字。格式：\n{"pages":[{"n":1,"text":"印在书上的文字","scene":"这一页画面里有什么、角色在做什么（写给画师）","interact":"给陪读人的一句互动提示"}]}\n要求：pages 正好 '+pagesN()+' 条；每页 text 为 '+b.chars[0]+'—'+b.chars[1]+' 个汉字；scene 写清画面而不是复述 text；interact 的口吻是：'+INTERACT[S.role]+'，不要重复正文。';}
function pEdit(pages){const b={chars:cr()},d=S.outline.d;return '【任务:edit】你是「文学编辑」智能体，资深儿童图画书编辑。下面是故事作家的初稿。请把它当作即将出版的绘本：先逐页大声朗读，标出不顺口、不具体、不好听的地方，再动笔修改。\n\n'+brief()+
  '\n\n【梗概要点】故事核：'+(d.heart||d.logline||'')+'；情感弧线：'+(d.arc||'')+'；反复句：'+(d.refrain||'无')+'；核心意象：'+(d.motif||'无')+
  '\n【初稿】\n'+JSON.stringify(pages.map(p=>({n:p.n,text:p.text})))+'\n\n'+CRAFT+'\n\n【编辑约束】\n'+S.cons.editor+'\n'+SAFETY+
  '\n\n修改规则：\n1. 页数、情节顺序、每页发生的事和知识点都不变；只改写句子，不新增情节和角色。\n2. 每页 text 仍为 '+b.chars[0]+'—'+b.chars[1]+' 个汉字。\n3. 重点改：念起来拗口或节奏平的句子；书面腔、空泛形容词、成语堆砌；说教句和总结句；重复啰嗦的词；画面能看到却还在描述的内容。\n4. 重点强化：反复句在关键页出现、最后一次变奏；首尾意象呼应；每页结尾的翻页钩子；最后一句短而有余味。\n5. 已经写得好的句子保持原样。\n\n只输出一个 JSON 对象，不要任何其他文字。格式：\n{"pages":[{"n":1,"text":"修改后的整页文字"}],"notes":["改了什么、为什么，每条不超过30字，最多4条"]}\npages 正好 '+pages.length+' 条。';}

function pSheet(){return '【任务:sheet】你是「角色设计师」智能体。请用 SVG 代码画一张角色定妆图。只输出一个完整的 <svg>…</svg>，不要解释，不要代码围栏。\n\n画布：viewBox="0 0 600 320"，浅色纯色背景。把下面每个角色画成全身站姿，并排摆放，互不重叠，每个角色放在各自的 <g id="c1">、<g id="c2"> 里。\n【角色】\n'+charText()+'\n'+styleLine()+'\n【设计约束】\n'+S.cons.designer+'\n硬性要求：不出现任何文字；不使用 <text>、<image>、<script>、<foreignObject>、<style> 和外部链接；五官清楚、表情友好；所有标签闭合；总长度不超过 4500 个字符。';}
